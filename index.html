<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST Module 4 — Decide</title><style>html,body{margin:0;height:100%;background:#eef3f6}#core{width:100%;height:100%;border:0;display:block}.returnBar{position:fixed;z-index:30;left:16px;right:16px;bottom:14px;background:#102b46;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0005;display:none;align-items:center;justify-content:space-between;gap:12px;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.returnBar.show{display:flex}.returnBar small{color:#dceaf4}.returnBar button{border:0;border-radius:10px;background:#f0bd4e;color:#30270e;font-weight:900;padding:11px 15px;cursor:pointer}@media(max-width:680px){.returnBar{flex-direction:column;align-items:flex-start}}</style></head><body><iframe id="core" title="BOOST Module 4 Decide"></iframe><div id="returnBar" class="returnBar"><div><b>Decision saved</b><br><small>Your evidence-based direction is ready to carry back to BOOST.</small></div><button id="finishBtn" type="button">SAVE RESULTS & RETURN TO BOOST →</button></div><script>
const KEY='pinal_boost_career_exploration_v1';const qs=new URLSearchParams(location.search);const ret=qs.get('boost_return'),mod=qs.get('boost_module'),nonce=qs.get('boost_nonce');const frame=document.getElementById('core'),bar=document.getElementById('returnBar');frame.src='decide-core.html'+location.search;
function state(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(_){return{}}}
function validReturn(){if(!ret||!mod||!nonce)return null;try{const u=new URL(ret,location.href);if(u.origin!==location.origin)return null;return u}catch(_){return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function names(arr){return (Array.isArray(arr)?arr:[]).map(x=>typeof x==='string'?x:(x?.skill||x?.name||x?.title||x?.activity)).filter(Boolean)}
function m3Strengths(s){const m=s?.module3||{},a=Array.isArray(m.selfAssessment)?m.selfAssessment:[];return [...new Set(a.filter(x=>/Used Regularly|Used Sometimes/i.test(String(x?.use||''))).map(x=>x?.skill||x?.name||x?.title||x?.activity).filter(Boolean))].slice(0,4)}
function injectEvidence(){let d;try{d=frame.contentDocument}catch(_){return}if(!d)return;const panel=d.getElementById('evidencePanel'),evidence=d.getElementById('evidence');if(!panel||!evidence||panel.classList.contains('hidden'))return;let box=d.getElementById('boostSkillContext');if(!box){box=d.createElement('div');box.id='boostSkillContext';evidence.insertAdjacentElement('afterend',box)}const s=state(),sm=s.skillMobility||null;let strengths=names(sm?.strengthsToCarryForward).slice(0,4);if(!strengths.length)strengths=m3Strengths(s);const want=names(sm?.wantMore).slice(0,4),exploring=names(sm?.stillExploring).slice(0,3);if(!strengths.length&&!want.length&&!exploring.length){box.style.display='none';return}box.style.cssText='display:block;margin-top:15px;padding:15px;border:1px solid #cfe0e8;border-radius:14px;background:#f6fbfd;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif';const tags=(arr,bg,border,color)=>arr.length?`<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:7px">${arr.map(x=>`<span style="padding:6px 9px;border-radius:999px;background:${bg};border:1px solid ${border};color:${color};font-size:.8rem;font-weight:800">${esc(x)}</span>`).join('')}</div>`:'<div style="color:#61717e;font-size:.9rem;margin-top:7px">No strong signal recorded here yet.</div>';box.innerHTML=`<h3 style="margin:.1rem 0 .35rem;color:#174e7b">What your Skill Mobility experience showed</h3><p style="margin:.25rem 0 .8rem;line-height:1.5;color:#526675">This evidence does <b>not</b> choose your route. It helps you compare this career with the strengths you can carry forward and the kinds of work you want more opportunities to use.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px"><div style="padding:12px;border-radius:12px;background:#fff;border:1px solid #d7e4eb"><small style="display:block;color:#61717e;font-weight:800">STRENGTHS TO CARRY FORWARD</small>${tags(strengths,'#edf4f8','#c9dce7','#173042')}</div><div style="padding:12px;border-radius:12px;background:#f2faf6;border:1px solid #b7ddc8"><small style="display:block;color:#176044;font-weight:800">WAYS OF WORKING YOU WANT MORE OF</small>${tags(want,'#e7f6ee','#a9d8bd','#176044')}</div>${exploring.length?`<div style="padding:12px;border-radius:12px;background:#fffaf0;border:1px solid #ead7a0"><small style="display:block;color:#745700;font-weight:800">STILL EXPLORING</small>${tags(exploring,'#fff5d8','#e7c866','#745700')}</div>`:''}</div>`}
function refresh(){injectEvidence();const s=state();bar.classList.toggle('show',!!(s?.module4?.completedAt&&validReturn()))}
frame.addEventListener('load',()=>{refresh();try{new MutationObserver(refresh).observe(frame.contentDocument.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})}catch(_){}});setInterval(refresh,700);
document.getElementById('finishBtn').onclick=()=>{const u=validReturn();if(!u){bar.classList.remove('show');return}u.searchParams.set('boost_complete',mod);u.searchParams.set('boost_nonce',nonce);location.assign(u.toString())};
</script></body></html>
