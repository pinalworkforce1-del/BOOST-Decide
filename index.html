<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST Module 4 — Decide</title><style>html,body{height:100%;margin:0;background:#eef3f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}#app{width:100%;height:100%;border:0;display:block}.returnBar{position:fixed;z-index:20;left:16px;right:16px;bottom:14px;background:#102b46;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0005;display:none;align-items:center;justify-content:space-between;gap:12px}.returnBar.show{display:flex}.returnBar small{color:#dceaf4}.returnBar button{border:0;border-radius:10px;background:#f0bd4e;color:#30270e;font-weight:900;padding:11px 15px;cursor:pointer}.notice{position:fixed;z-index:21;top:12px;left:50%;transform:translateX(-50%);max-width:820px;width:calc(100% - 32px);background:#fff8e8;border:1px solid #e6cf94;border-radius:12px;padding:10px 13px;box-shadow:0 8px 25px #0002;display:none}.notice.show{display:block}.notice a{font-weight:800;color:#174e7b}@media(max-width:680px){.returnBar{flex-direction:column;align-items:flex-start}}</style></head><body><div id="notice" class="notice"></div><iframe id="app" src="pathway-progression-test.html" title="BOOST Module 4 Decide"></iframe><div id="returnBar" class="returnBar"><div><b>Decision saved</b><br><small>Return to your BOOST pathway when you are ready.</small></div><button id="returnBtn">Mark Complete & Return to BOOST</button></div><script>const KEY='pinal_boost_career_exploration_v1';const qs=new URLSearchParams(location.search);const ret=qs.get('boost_return'),mod=qs.get('boost_module'),nonce=qs.get('boost_nonce');const iframe=document.getElementById('app'),bar=document.getElementById('returnBar'),notice=document.getElementById('notice');function getState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}}function hasCareers(){return !!(getState()?.module1?.selected||[]).length}if(!hasCareers()){notice.classList.add('show');notice.innerHTML='<b>BOOST needs the career evidence carried forward from the earlier modules.</b> If you opened Module 4 directly, run the progression flow first so your career, wage, and preparation evidence can be used. <a href="https://pinalworkforce1-del.github.io/BOOST-Career-Validation/pathway-progression-test.html">Open the evidence-enabled Module 2 flow</a>.'}function validReturn(){if(!ret||!mod||!nonce)return null;try{const u=new URL(ret,location.href);if(u.origin!==location.origin)return null;return u}catch(_){return null}}function refresh(){const s=getState();if(s?.module4?.completedAt&&validReturn())bar.classList.add('show');else bar.classList.remove('show')}setInterval(refresh,700);window.addEventListener('storage',refresh);document.getElementById('returnBtn').onclick=()=>{const u=validReturn();if(!u)return;u.searchParams.set('boost_complete',mod);u.searchParams.set('boost_nonce',nonce);location.href=u.toString()};refresh();</script></body></html>
