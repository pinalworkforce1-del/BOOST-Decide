<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST Module 4 — Decide</title><style>html,body{height:100%;margin:0;background:#eef3f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}#app{width:100%;height:100%;border:0;display:block}.returnBar{position:fixed;z-index:20;left:16px;right:16px;bottom:14px;background:#102b46;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0005;display:none;align-items:center;justify-content:space-between;gap:12px}.returnBar.show{display:flex}.returnBar small{color:#dceaf4}.returnBar button{border:0;border-radius:10px;background:#f0bd4e;color:#30270e;font-weight:900;padding:11px 15px;cursor:pointer}.notice{position:fixed;z-index:21;top:12px;left:50%;transform:translateX(-50%);max-width:820px;width:calc(100% - 32px);background:#fff8e8;border:1px solid #e6cf94;border-radius:12px;padding:10px 13px;box-shadow:0 8px 25px #0002;display:none}.notice.show{display:block}.notice a{font-weight:800;color:#174e7b}@media(max-width:680px){.returnBar{flex-direction:column;align-items:flex-start}}</style></head><body><div id="notice" class="notice"></div><iframe id="app" src="pathway-progression-test.html" title="BOOST Module 4 Decide"></iframe><div id="returnBar" class="returnBar"><div><b>Decision saved</b><br><small>Return to your BOOST pathway when you are ready.</small></div><button id="returnBtn">Mark Complete & Return to BOOST</button></div><script>const KEY='pinal_boost_career_exploration_v1';const qs=new URLSearchParams(location.search);const ret=qs.get('boost_return'),mod=qs.get('boost_module'),nonce=qs.get('boost_nonce');const iframe=document.getElementById('app'),bar=document.getElementById('returnBar'),notice=document.getElementById('notice');function getState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}}function hasCareers(){return !!(getState()?.module1?.selected||[]).length}if(!hasCareers()){notice.classList.add('show');notice.innerHTML='<b>BOOST needs the career evidence carried forward from the earlier modules.</b> Return to your BOOST pathway and complete Modules 1–3 before opening Module 4.'}function validReturn(){if(!ret||!mod||!nonce)return null;try{const u=new URL(ret,location.href);if(u.origin!==location.origin)return null;return u}catch(_){return null}}function refresh(){const s=getState();if(s?.module4?.completedAt&&validReturn())bar.classList.add('show');else bar.classList.remove('show')}setInterval(refresh,700);window.addEventListener('storage',refresh);document.getElementById('returnBtn').onclick=()=>{const u=validReturn();if(!u)return;u.searchParams.set('boost_complete',mod);u.searchParams.set('boost_nonce',nonce);location.href=u.toString()};function scrubText(s){return s.replace(/BOOST\s*•\s*Module 4 Prototype/gi,'BOOST • Module 4').replace(/TEST ONLY\s*[—-]\s*live Module 4 is unchanged\.?/gi,'').replace(/Prototype fallback evidence/gi,'BOOST preparation evidence').replace(/test record/gi,'career record').replace(/progression prototype/gi,'BOOST pathway').replace(/Module 2 not rerun for this test/gi,'Module 2 evidence not available').replace(/Prototype note:/gi,'Preparation evidence note:').replace(/for testing\. Rerunning Module 2 will replace it with the actual carried record\./gi,'while your carried Module 2 record is unavailable. Your career coach can help verify current employer requirements.').replace(/Rosie audio will appear automatically when\s+[^.]+?\s+is uploaded\./gi,'Audio tip unavailable right now.').replace(/Rosie audio will appear here when\s+[^.]+?\s+is uploaded\./gi,'Audio tip unavailable right now.')}function scrubFrame(){let d;try{d=iframe.contentDocument}catch(_){return}if(!d)return;d.querySelectorAll('.test').forEach(el=>el.remove());d.querySelectorAll('.audioWaiting').forEach(el=>{el.textContent='Audio tip unavailable right now.'});d.querySelectorAll('a[href*="pathway-progression-test.html"]').forEach(a=>{if((a.textContent||'').toLowerCase().includes('module 1')){a.href='https://pinalworkforce1-del.github.io/BOOST_Pathway-Portal/';a.textContent='Return to your BOOST pathway'}});const w=d.createTreeWalker(d.body||d,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const v=scrubText(n.nodeValue||'');if(v!==n.nodeValue)n.nodeValue=v});if(d.title&&/test|prototype/i.test(d.title))d.title='BOOST Module 4 — Decide'}iframe.addEventListener('load',()=>{scrubFrame();try{const d=iframe.contentDocument;const obs=new MutationObserver(()=>scrubFrame());obs.observe(d.body,{childList:true,subtree:true,characterData:true})}catch(_){}});refresh();</script></body></html>
