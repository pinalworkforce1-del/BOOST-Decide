name: Wire textual alignment language
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-alignment-language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('career-decision-report.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="alignment-language-v1.js?v=20261015a"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('missing body')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check alignment-language-v1.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-decision-report.html
          git commit -m "Use textual alignment rating in participant report"
          git push
