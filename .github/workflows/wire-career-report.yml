name: Wire Pinal Career Decision Report

on:
  push:
    branches:
      - pinal-career-report-2026-09-10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pinal-career-report-2026-09-10
          fetch-depth: 0
      - name: Add report button to Module 4 result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="actions"><button id="finishFromModule" class="secondary" type="button">SAVE RESULTS & RETURN TO BOOST →</button>'
          replacement = '<div class="actions"><button id="openReport" class="secondary" type="button">OPEN MY CAREER DECISION REPORT ↗</button><button id="finishFromModule" class="secondary" type="button">SAVE RESULTS & RETURN TO BOOST →</button>'
          if 'id="openReport"' not in s:
              if marker not in s:
                  raise SystemExit('Result action marker not found')
              s = s.replace(marker, replacement, 1)
          listener = "$('finishFromModule').addEventListener('click',finishToPortal);"
          listener_replacement = "$('openReport').addEventListener('click',()=>window.open('career-decision-report.html','_blank','noopener'));$('finishFromModule').addEventListener('click',finishToPortal);"
          if "$('openReport').addEventListener" not in s:
              if listener not in s:
                  raise SystemExit('Finish listener marker not found')
              s = s.replace(listener, listener_replacement, 1)
          note = '<div class="completionNote">When you are satisfied with this direction, use <b>Save Results & Return to BOOST</b>. The map will determine what comes next.</div>'
          note_replacement = '<div class="completionNote">Your decision is ready. Open your <b>Career Decision Report</b> for the participant and coach summary, then use <b>Save Results & Return to BOOST</b> when you are ready to continue.</div>'
          if note in s:
              s = s.replace(note, note_replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire Career Decision Report into Module 4"
          git push origin HEAD:pinal-career-report-2026-09-10
