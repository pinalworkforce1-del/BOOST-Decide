<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinal BOOST Career Decision Report</title>
<style>
:root{--navy:#102b46;--blue:#246a8d;--green:#176f66;--gold:#dca733;--purple:#7554a8;--red:#9a4937;--ink:#183244;--muted:#60717d;--line:#d7e2e9;--paper:#fff;--bg:#eaf0f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.45}
.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:#081e31;color:#fff}.toolbar a,.toolbar button{border:1px solid #ffffff35;background:#ffffff10;color:#fff;border-radius:999px;padding:9px 13px;font-weight:850;text-decoration:none;cursor:pointer}.toolbar button.active{background:#fff;color:#12324a}.toolbar .print{margin-left:auto;background:#dca733;color:#302300;border-color:#f1ce6f}.printHint{font-size:.75rem;color:#d8e8f2}
.page{width:min(960px,calc(100% - 28px));margin:22px auto;background:var(--paper);box-shadow:0 12px 34px #19364a20;border-radius:18px;overflow:hidden}.reportHeader{padding:24px 30px;background:linear-gradient(135deg,#0e3049,#1f638b);color:#fff;border-bottom:6px solid var(--gold)}.headerRow{display:flex;gap:24px;align-items:flex-start;justify-content:space-between}.brandWrap{background:#fff;border-radius:12px;padding:9px 13px;color:#233d77;text-align:center;min-width:205px}.brandMain{font-size:1.15rem;font-weight:1000;letter-spacing:.04em}.brandSub{font-size:.78rem;color:#56697a;margin-top:2px}.brandWrap img{display:block;width:100%;max-width:220px;height:auto}.kicker{text-transform:uppercase;letter-spacing:.1em;font-size:.74rem;font-weight:900;color:#ffdf88}.reportHeader h1{margin:.25rem 0 .35rem;font-size:clamp(2rem,5vw,3.15rem)}.reportHeader p{margin:0;color:#eaf5fb;max-width:630px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 30px;background:#f5f8fa;border-bottom:1px solid var(--line)}.meta div{font-size:.88rem}.meta small,.label{display:block;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-size:.7rem;font-weight:900}.content{padding:20px 30px 30px}.intro{padding:13px 15px;background:#f2f8fb;border-left:5px solid var(--blue);border-radius:12px;margin-bottom:16px}
.section{margin:19px 0}.section h2{margin:0 0 9px;color:var(--navy);font-size:1.22rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.card b{display:block;margin-top:3px}.route{padding:16px;border-radius:14px;color:#fff}.route.READY{background:linear-gradient(135deg,#176f66,#2a9d8f)}.route.BRIDGE{background:linear-gradient(135deg,#246a8d,#438fc0)}.route.BUILD{background:linear-gradient(135deg,#664393,#896bc0)}.route.RECONSIDER{background:linear-gradient(135deg,#87563f,#aa765d)}.route .routeName{font-size:1.65rem;font-weight:1000}
.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #cbd8e0;background:#f7fafb;border-radius:999px;padding:6px 9px;font-size:.82rem;font-weight:750}.path{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap}.step{flex:1 1 175px;padding:11px;border-radius:12px;background:#f2f8fb;border:1px solid #cce0ea}.arrow{align-self:center;font-weight:1000;color:#4b7088}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.support{border-left:5px solid var(--green);background:#f0faf5}.attention{border-left:5px solid var(--gold);background:#fff8e8}.support,.attention{padding:12px 14px;border-radius:12px}.support ul,.attention ul,.coachList{margin:.35rem 0 .05rem;padding-left:1.15rem}.footerNote{margin-top:21px;padding:13px;border-radius:12px;background:#f6f2fb;border-left:5px solid var(--purple)}.coachOnly{display:none}.coachMode .participantOnly{display:none}.coachMode .coachOnly{display:block}.coachBox{padding:12px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.empty{padding:28px 34px}.empty a{color:#174f77;font-weight:800}
.wageCompare{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.wageDelta{border:2px solid #c7d9e2}.wageDelta.up{border-color:#9fd1b7;background:#f0faf5}.wageDelta.down{border-color:#e3b49f;background:#fff5ef}.wageDelta.flat{border-color:#ccd8df;background:#f7fafb}.deltaBig{font-size:1.18rem;font-weight:950}.wageInput{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px;border:1px dashed #a9c2d0;border-radius:12px;background:#f7fafb}.wageInput label{font-weight:850}.wageInput input{display:block;margin-top:5px;width:180px;padding:9px;border:1px solid #b8cbd6;border-radius:9px;font:inherit}.wageInput button{padding:9px 12px;border:0;border-radius:9px;background:#173f61;color:#fff;font-weight:900;cursor:pointer}.assumption{font-size:.78rem;color:var(--muted);margin-top:7px}.muted{color:var(--muted)}
@media(max-width:700px){.meta,.grid,.twoCol,.wageCompare{grid-template-columns:1fr}.headerRow{display:block}.brandWrap{display:inline-block;margin-top:14px}.reportHeader,.content,.meta{padding-left:18px;padding-right:18px}.arrow{display:none}.toolbar .print{margin-left:0}.printHint{width:100%}}
@page{size:Letter;margin:.38in .42in .42in}
@media print{html,body{background:#fff;font-size:9.7pt;line-height:1.27}.toolbar,.screenOnly{display:none!important}.page{width:100%;margin:0;box-shadow:none;border-radius:0;overflow:visible}.reportHeader{padding:13px 17px;border-bottom-width:4px}.headerRow{gap:12px}.brandWrap{padding:5px 8px;border-radius:7px;min-width:165px}.brandMain{font-size:10pt}.brandSub{font-size:7pt}.kicker{font-size:6.8pt}.reportHeader h1{font-size:23pt;margin:.1rem 0 .18rem}.reportHeader p{font-size:9pt}.meta{padding:7px 17px;gap:6px}.meta div{font-size:8.7pt}.content{padding:9px 17px 11px}.intro{padding:8px 10px;margin-bottom:8px}.route{padding:9px 11px;break-inside:avoid}.route .routeName{font-size:16pt}.section{margin:10px 0;break-inside:auto}.section h2{font-size:12pt;margin-bottom:5px}.grid,.twoCol,.wageCompare{gap:5px}.card,.step,.support,.attention,.coachBox,.footerNote{padding:7px 8px;break-inside:avoid}.pills{gap:4px}.pill{padding:3px 6px;font-size:7.5pt}.path{gap:4px}.step{flex-basis:135px}.footerNote{margin-top:9px}.assumption{font-size:7pt}.reportHeader,.route,.intro,.support,.attention,.footerNote,.step,.wageDelta{-webkit-print-color-adjust:exact;print-color-adjust:exact}.coachMode .participantOnly{display:none!important}.coachMode .coachOnly{display:block!important}.participantOnly,.coachOnly{break-inside:auto}}
</style>
</head>
<body>
<div class="toolbar"><a href="index.html">← Module 4</a><a href="https://pinalworkforce1-del.github.io/BOOST_Pathway-Portal/">BOOST Map</a><button id="participantBtn" class="active">Participant Report</button><button id="coachBtn">Career Coach Summary</button><span class="printHint">Clean PDF: turn off “Headers and footers” in the print dialog.</span><button id="printBtn" class="print">Print / Save as PDF</button></div>
<div id="app" class="page"></div>
<script>
'use strict';
const KEY='pinal_boost_career_exploration_v1';
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}};
const write=o=>{o.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(o));return o};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number.isFinite(Number(v))?'$'+Number(v).toFixed(2):'—';const num=v=>Number.isFinite(Number(v))?Math.round(Number(v)).toLocaleString():'—';
let S=read(),M1=S.module1||{},M2=S.module2||{},M3=S.module3||{},M4=S.module4||{};
const ROUTE_NAMES={READY:'WORK NOW',BRIDGE:'EARN WHILE YOU LEARN',BUILD:'TRAINING INVESTMENT CONVERSATION',RECONSIDER:'EXPLORE BEFORE COMMITTING'};
const SOC=String(M4.selectedSoc||M4.career?.soc||'');const target={soc:SOC,title:M4.careerTitle||M4.career?.title||SOC};
function findCareer(){return [...(M3.careers||[]),...(M2.careers||[]),...(M1.selected||[])].find(x=>String(x?.soc||'')===SOC)||{}}
const C=findCareer(),V=M2.validationBySoc?.[SOC]||{},A=M3.skillAlignmentBySoc?.[SOC]||{};
function participantName(){const p=S.participant||{};return p.fullName||p.name||[p.firstName,p.lastName].filter(Boolean).join(' ')||p.first_name||'BOOST Participant'}
function themes(){const t=M1.topInterests||[];const names={R:'Realistic',I:'Investigative',A:'Artistic',S:'Social',E:'Enterprising',C:'Conventional'};return t.slice(0,3).map(x=>typeof x==='string'?(names[x]||x):(x.label||names[x.code]||x.code)).filter(Boolean)}
function strengths(){const out=[];for(const x of (M3.selfAssessment||[])){if(/Used Regularly|Used Sometimes/i.test(String(x?.use||'')))out.push(x.skill||x.name||x.activity)}for(const x of (M3.skillEvidence||[]))out.push(typeof x==='string'?x:(x.skill||x.name||x.label));return [...new Set(out.filter(Boolean))].slice(0,8)}
function route(){return M4.route||M4.participantDirection||M4.decision?.code||'RECONSIDER'}
function entryHourly(){const n=Number(M4.entryWage?.hourly??V.entryWage?.hourly??C.regional?.p25Hourly??C.wage25);return Number.isFinite(n)&&n>0?n:null}
function medianHourly(){const n=Number(C.regional?.medianHourly??C.wageMedian);return Number.isFinite(n)&&n>0?n:null}
function baselineHourly(){const p=S.participant||{},vals=[M2.currentHourlyWage,M2.wageBaseline?.hourly,p.currentHourlyWage,p.currentWageHourly,p.lastHourlyWage,M1.currentHourlyWage,S.currentHourlyWage,M4.wageComparison?.baselineHourly];for(const v of vals){const n=Number(v);if(Number.isFinite(n)&&n>0)return n}return null}
function wageComparison(){const base=baselineHourly(),entry=entryHourly(),median=medianHourly();if(!base||!entry)return null;const baseAnnual=base*2080,entryAnnual=entry*2080,delta=entryAnnual-baseAnnual,pct=delta/baseAnnual*100;return{base,entry,median,baseAnnual,entryAnnual,medianAnnual:median?median*2080:null,delta,pct}}
function saveBaseline(v){const n=Number(v);if(!Number.isFinite(n)||n<=0||n>250){alert('Enter a valid hourly wage.');return}S=read();S.participant=S.participant||{};S.participant.currentHourlyWage=n;S.module2=S.module2||M2;S.module2.currentHourlyWage=n;S.module2.wageBaseline={hourly:n,annual:n*2080,annualHours:2080,source:'Participant current or most recent hourly wage',required:true,updatedAt:new Date().toISOString()};S.module4=S.module4||M4;S.module4.wageComparison={...(S.module4.wageComparison||{}),baselineHourly:n,entryHourly:entryHourly(),medianHourly:medianHourly(),annualHours:2080,updatedAt:new Date().toISOString()};write(S);location.reload()}
function regional(){const r=C.regional||{};const jobs=r.jobs26??C.jobs,open=r.annualOpenings??C.annualOpenings,growth=r.growthPct??C.growthPercent;return [jobs!=null?`${num(jobs)} regional jobs`:'',open!=null?`${num(open)} annual openings`:'',growth!=null?`${Number(growth)>0?'+':''}${Number(growth).toFixed(1)}% projected growth`:''].filter(Boolean).join(' • ')||r.tier||'Pinal County regional evidence'}
function wageEvidence(){const e=entryHourly(),m=medianHourly(),a=[];if(e)a.push(`Entry estimate ${money(e)}/hr`);if(m)a.push(`Median ${money(m)}/hr`);if(V.wages)a.push(V.wages);return a.join(' • ')||'Wage evidence not recorded'}
function preparation(){const x=M4.preparationIntel||V.preparationIntel||C.preparationIntel||{},b=x.baseline||{};return{label:x.label||'Preparation reviewed',education:x.education||b.education||C.preparation?.education||'Varies by occupation',experience:x.experience||b.experience||b.workExperience||C.preparation?.experience||'Varies by occupation',ojt:x.ojt||b.ojt||b.onTheJobTraining||C.preparation?.ojt||'Varies by occupation'}}
function pathwaySteps(){const p=C.pathway||{};const out=[];if(target.title)out.push({label:'START HERE',value:target.title});if(Array.isArray(p.bridge))p.bridge.forEach(x=>out.push({label:'NEXT MOVE',value:x}));if(Array.isArray(p.dest))p.dest.forEach(x=>out.push({label:'LONGER-TERM OPTION',value:x}));if(out.length===1){if(p.position)out.push({label:'PATHWAY POSITION',value:p.position});if(p.destinationStory)out.push({label:'WHERE THIS CAN LEAD',value:p.destinationStory});}return out}
function routeWhy(){const r=route(),map={READY:'The combined evidence supports competing for this role now. Continue using your Career Coach and employer research to target the strongest opportunities.',BRIDGE:'A preparation gap remains, and BOOST has verified employer-supported evidence that may help close it while you earn.',BUILD:'The career remains worth considering, but an occupation-specific preparation, credential, or license gap should be addressed before treating it as ready-now work.',RECONSIDER:'Some part of the wage, life fit, preparation, confidence, or employer evidence suggests more exploration would be useful before committing.'};return map[r]||map.RECONSIDER}
function supports(){const x=[],r=C.regional||{};if(r.tier)x.push(`${r.tier} in Pinal County`);if(A.already!=null&&A.total)x.push(`${A.already} of ${A.total} high-use skill patterns already appear in your experience`);if(V.wages&&!/no|does not|not work/i.test(V.wages))x.push(`Wage fit: ${V.wages}`);if(V.life&&!/no|does not/i.test(V.life))x.push(`Life fit: ${V.life}`);strengths().slice(0,3).forEach(s=>x.push(`Transferable strength: ${s}`));const wc=wageComparison();if(wc&&wc.delta>0)x.push(`Estimated entry wage is about $${Math.round(wc.delta).toLocaleString()}/yr above current/most recent earnings`);return [...new Set(x)].slice(0,7)}
function attention(){const x=[],p=preparation(),wc=wageComparison();if(route()==='BUILD')x.push(`Preparation needs attention: ${p.label}`);if(route()==='BRIDGE')x.push('Confirm the exact employer-supported route, eligibility, timing, and commitments');if(!M4.employerBridgeEvidence&&route()!=='READY')x.push('No verified employer-supported/WBL route is currently attached to this decision');if(V.wages&&/maybe|tight|no|higher/i.test(V.wages))x.push(`Wage consideration: ${V.wages}`);if(wc&&wc.delta<0)x.push(`Estimated entry wage is about $${Math.abs(Math.round(wc.delta)).toLocaleString()}/yr below current/most recent earnings`);if(V.life&&/maybe|no|adjust/i.test(V.life))x.push(`Life-fit consideration: ${V.life}`);if(V.future&&/no|reconsider|uncertain/i.test(V.future))x.push(`Future-direction consideration: ${V.future}`);if(!x.length)x.push('Continue validating employer-specific requirements, schedule, commute, and advancement expectations before acting');return [...new Set(x)].slice(0,7)}
function coachPrompts(){const r=route(),p=preparation(),wc=wageComparison(),x=[];if(r==='READY')x.push('Which employers and openings should we target first?','What résumé evidence best demonstrates the transferable strengths identified in BOOST?','What wage and schedule boundaries should guide the job search?');else if(r==='BRIDGE')x.push('What verified employer-supported route is available, and what are its exact entry requirements?','Can OJT, apprenticeship, employer-paid credentialing, or another earn-while-you-learn option close the identified gap?','What is the backup plan if the employer-supported route does not materialize?');else if(r==='BUILD')x.push(`What is the smallest credible preparation investment needed for entry (${p.education})?`,'What approved training options, costs, duration, and funding rules should we compare?','Does the likely wage gain justify the training investment and time away from work?','Is there a lower-barrier related occupation that could be pursued first while building toward this target?');else x.push('Which part of the evidence is creating the most hesitation—wage, life fit, preparation, or confidence?','Should we revisit a paused career or intentionally explore a different occupation?','What additional employer or networking research would make the decision clearer?');if(wc&&wc.delta<0)x.unshift('If the estimated entry wage is lower than current earnings, is the short-term reduction workable and what is the likely timeline to recover it?');return x}
const list=items=>`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;const pills=items=>items.length?`<div class="pills">${items.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:'<span class="muted">No additional evidence recorded.</span>';
function wageMarkup(){const wc=wageComparison();if(!wc)return `<div class="section screenOnly"><h2>Annualized wage comparison</h2><div class="wageInput"><label>Current / most recent hourly wage <input id="baselineWage" type="number" min="1" max="250" step="0.01" placeholder="e.g., 21.50"></label><button id="saveWage" type="button">ADD WAGE COMPARISON</button><div class="muted">This appears to be an older journey without a saved Module 2 wage baseline. Add it here once; it will be saved back into your BOOST journey.</div></div></div>`;const cls=wc.delta>1?'up':wc.delta<-1?'down':'flat',sign=wc.delta>0?'+':wc.delta<0?'-':'';return `<div class="section"><h2>Annualized wage comparison</h2><div class="wageCompare"><div class="card"><span class="label">CURRENT / MOST RECENT</span><b>${money(wc.base)}/hr</b><span>≈ $${Math.round(wc.baseAnnual).toLocaleString()}/yr</span></div><div class="card"><span class="label">ESTIMATED POINT OF ENTRY</span><b>${money(wc.entry)}/hr</b><span>≈ $${Math.round(wc.entryAnnual).toLocaleString()}/yr</span></div><div class="card wageDelta ${cls}"><span class="label">ANNUALIZED CHANGE AT ENTRY</span><div class="deltaBig">${sign}$${Math.abs(Math.round(wc.delta)).toLocaleString()}/yr (${wc.pct>0?'+':''}${wc.pct.toFixed(1)}%)</div>${wc.delta<0?'<span>This is a potential short-term earnings decrease and should be part of the decision conversation.</span>':wc.delta>0?'<span>This is a potential earnings increase at the estimated entry wage.</span>':'<span>The estimated entry wage is roughly level with current earnings.</span>'}</div></div>${wc.medianAnnual?`<div class="assumption">Median earnings context: ${money(wc.median)}/hr ≈ $${Math.round(wc.medianAnnual).toLocaleString()}/yr. Annualized figures assume 2,080 paid hours and do not include overtime, benefits, taxes, or unpaid time.</div>`:`<div class="assumption">Annualized figures assume 2,080 paid hours and do not include overtime, benefits, taxes, or unpaid time.</div>`}</div>`}
function render(){const app=document.getElementById('app');if(!SOC||!M4.completedAt){app.innerHTML='<div class="empty"><h2>Your Career Decision Report is not ready yet.</h2><p>Complete Module 4 and generate your evidence-based direction first.</p><a href="index.html">Return to Module 4 →</a></div>';return}const p=preparation(),ps=pathwaySteps(),r=route(),date=new Date(M4.completedAt).toLocaleDateString();app.innerHTML=`<header class="reportHeader"><div class="headerRow"><div><div class="kicker">Pinal County BOOST</div><h1>Career Decision Report</h1><p>A personalized summary of the evidence gathered through Discover, Validate, Career Mobility, and Decide.</p></div><div class="brandWrap"><img src="assets/images/pinal-logo.webp" alt="ARIZONA@WORK Pinal County"></div></div></header><div class="meta"><div><small>Participant</small><b>${esc(participantName())}</b></div><div><small>Career</small><b>${esc(target.title)}</b></div><div><small>Decision date</small><b>${esc(date)}</b></div></div><div class="content"><section class="participantOnly"><div class="intro">This report brings together your interests, labor-market research, transferable experience, preparation evidence, life considerations, wage context, H3/pathway information, and final BOOST direction. It is designed to support a thoughtful decision and a focused conversation with your Career Coach—not to make the decision for you.</div><div class="route ${esc(r)}"><span class="label" style="color:#fff9">CURRENT BOOST DIRECTION</span><div class="routeName">${esc(ROUTE_NAMES[r]||r)}</div><div>${esc(routeWhy())}</div></div><div class="section"><h2>What you learned about yourself</h2><div class="grid"><div class="card"><span class="label">STRONGEST INTEREST THEMES</span><b>${esc(themes().join(' • ')||'Not recorded')}</b></div><div class="card"><span class="label">CAREER MOBILITY EVIDENCE</span><b>${A.already!=null&&A.total?`${A.already} of ${A.total} high-use skill patterns already appear in your experience`:'Mobility reviewed'}</b></div></div><div class="section"><span class="label">TRANSFERABLE STRENGTHS</span>${pills(strengths())}</div></div><div class="section"><h2>Pinal County labor-market evidence</h2><div class="grid"><div class="card"><span class="label">REGIONAL / H3 CONTEXT</span><b>${esc(C.regional?.tier||C.pathway?.name||'Pinal regional evidence')}</b><span>${esc(regional())}</span></div><div class="card"><span class="label">WAGE EVIDENCE</span><b>${esc(wageEvidence())}</b></div></div></div>${wageMarkup()}<div class="section"><h2>Reality Check</h2><div class="grid"><div class="card"><span class="label">PREPARATION READINESS</span><b>${esc(V.prep||p.label)}</b></div><div class="card"><span class="label">TYPICAL ENTRY EDUCATION</span><b>${esc(p.education)}</b></div><div class="card"><span class="label">RELATED EXPERIENCE</span><b>${esc(p.experience)}</b></div><div class="card"><span class="label">TYPICAL ON-THE-JOB TRAINING</span><b>${esc(p.ojt)}</b></div><div class="card"><span class="label">LIFE FIT</span><b>${esc(V.life||'Not recorded')}</b></div><div class="card"><span class="label">EMPLOYER-SUPPORTED ROUTE</span><b>${M4.employerBridgeEvidence?'Verified employer-supported development found':esc(V.employerSupport||'No verified route carried forward')}</b></div></div></div>${ps.length>1?`<div class="section"><h2>Where this career can lead</h2><div class="path">${ps.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="step"><span class="label">${esc(x.label)}</span><b>${esc(x.value)}</b></div>`).join('')}</div></div>`:''}<div class="section"><h2>What supports this direction — and what still needs attention</h2><div class="twoCol"><div class="support"><b>Evidence supporting this direction</b>${list(supports())}</div><div class="attention"><b>Evidence to address or verify</b>${list(attention())}</div></div></div><div class="section"><h2>Your next conversation with your Career Coach</h2>${list(coachPrompts())}</div><div class="footerNote"><b>Keep using the evidence. ementById('baselineWage')?.value))}
